<!-- ====== SECCIÓN VERDE · ÚNETE (P3) ====== -->
<section class="unete" id="unete">
  <div class="wrap">
    <div class="unete-lead">
      <span class="eyebrow">¿Eres profesional o empresa?</span>
      <h2>Únete a una red seleccionada de oportunidades reales.</h2>
    </div>
    <div class="unete-valuebox">
      <ul class="benes">
        <li><span class="dash">—</span><span>Solo cobramos <b>cuando cierras</b> un trabajo</span></li>
        <li><span class="dash">—</span><span>Clientes <b>cualificados</b>, sin competir por precio</span></li>
        <li><span class="dash">—</span><span>Tu <b>escaparate</b> dentro del ecosistema</span></li>
      </ul>
      <!-- ÚNICO CAMBIO: el botón lleva al form y marca la intención -->
      <a class="btn" href="#contacto?intent=unirme">Quiero unirme a la red ↗</a>
    </div>
  </div>
</section>

<style>
.unete{background:#204438;padding:78px 0}
.unete .wrap{max-width:1180px;margin:0 auto;padding:0 40px;
  display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.unete .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.2em;
  text-transform:uppercase;color:#C15C38;display:inline-flex;align-items:center;gap:.7rem;font-weight:600}
.unete .eyebrow::before{content:"";width:26px;height:1px;background:#C15C38}
.unete h2{font-family:'Fraunces',serif;font-weight:500;color:#fff;
  font-size:clamp(2.2rem,4vw,3.3rem);line-height:1.08;letter-spacing:-.01em;margin-top:1.1rem}
.unete .unete-valuebox{border-left:1px solid rgba(234,231,221,.16);padding-left:40px}
.unete .benes{list-style:none;margin:0 0 22px;padding:0}
.unete .benes li{display:flex;gap:12px;align-items:baseline;padding:11px 0;
  color:#EAE7DD;font-size:1rem;border-bottom:1px solid rgba(234,231,221,.16)}
.unete .benes b{color:#fff;font-weight:600}
.unete .dash{color:#C15C38;flex:none}
.unete .btn{display:inline-flex;align-items:center;gap:.5rem;background:#C15C38;color:#fff;
  font-weight:600;font-size:.92rem;padding:.85rem 1.5rem;border-radius:999px;text-decoration:none;transition:background .2s}
.unete .btn:hover{background:#cf6942}
@media(max-width:820px){
  .unete .wrap{grid-template-columns:1fr;gap:34px}
  .unete .unete-valuebox{border-left:0;padding-left:0}
}
</style>

<!-- Preselecciona la pestaña del form (no toca tu form, solo activa el toggle) -->
<script>
document.querySelectorAll('a[href*="intent=unirme"]').forEach(a=>{
  a.addEventListener('click',()=>{
    // ajusta el selector si tu botón de pestaña usa otro data-attr
    const tab=document.querySelector('[data-intent="partner"]')||document.querySelector('[data-intent="unirme"]');
    if(tab) tab.click();
  });
});
</script>
